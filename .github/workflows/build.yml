
name: Java 21 Build and Release

on:
  push:
    branches: [main, javafx-update]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Compile and test
        run: gradle clean build

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: CHAT-RESEAU-JAR
          path: build/libs/CHAT_RESEAU.jar
          if-no-files-found: error

      - name: Calculate next version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          LATEST_TAG=$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/latest" \
            --jq '.tag_name' 2>/dev/null || true)

          if [[ -z "$LATEST_TAG" ]]; then
            NEW_TAG="v1.0.0"
          elif [[ "$LATEST_TAG" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          else
            echo "::error::Unsupported latest release tag: $LATEST_TAG"
            exit 1
          fi

          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Next release: $NEW_TAG"

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$NEW_TAG" \
            build/libs/CHAT_RESEAU.jar \
            --title "$NEW_TAG" \
            --notes "Automated release built with Java 21." \
            --latest
            
